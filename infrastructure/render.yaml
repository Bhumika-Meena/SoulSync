envVarGroups:
  # Shared secrets group ensuring identical HMAC key across API and Agent
  - name: soulsync-shared-secrets
    envVars:
      - key: INTERNAL_AGENT_SECRET
        generateValue: true

services:
  # NestJS Core API Gateway (Multi-stage production Docker container)
  - type: web
    name: soulsync-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/healthz
    envVars:
      - fromGroup: soulsync-shared-secrets
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: soulsync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AGENT_SERVICE_URL
        value: http://soulsync-agent:8000
      - key: CORS_ORIGIN
        sync: false

  # Python Agent Service (FastAPI + LangGraph)
  - type: web
    name: soulsync-agent
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: services/agent/Dockerfile
    dockerContext: services/agent
    healthCheckPath: /healthz
    envVars:
      - fromGroup: soulsync-shared-secrets
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: INTERNAL_GATEWAY_URL
        value: http://soulsync-api:10000/internal/v1/tools/execute
      - key: OPENAI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL with pgvector extension support
  - name: soulsync-db
    plan: starter
    region: oregon
    databaseName: soulsync
    user: soulsync
