services:
  # NestJS Core API Gateway
  - type: web
    name: soulsync-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: apps/api
    buildCommand: pnpm --filter @soulsync/api build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: soulsync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_AGENT_SECRET
        generateValue: true

  # Python Agent Service (FastAPI + LangGraph)
  - type: web
    name: soulsync-agent
    runtime: docker
    plan: starter
    region: oregon
    rootDir: services/agent
    dockerfilePath: services/agent/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: soulsync-db
          property: connectionString

databases:
  # Managed PostgreSQL with pgvector extension support
  - name: soulsync-db
    plan: starter
    region: oregon
    databaseName: soulsync
    user: soulsync
